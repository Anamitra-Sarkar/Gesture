<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Hand gesture silhouette - open palm -->
  <g filter="url(#glow)">
    <!-- Palm base -->
    <ellipse cx="100" cy="120" rx="30" ry="35" fill="url(#grad1)" opacity="0.3"/>
    
    <!-- Thumb -->
    <path d="M 70 115 Q 60 100 55 85 Q 53 75 58 70 Q 63 65 68 70 Q 73 75 73 85 Q 73 100 75 110 Z" 
          fill="url(#grad1)" opacity="0.8"/>
    
    <!-- Index finger -->
    <path d="M 85 95 Q 83 70 85 50 Q 87 35 95 32 Q 103 30 105 38 Q 107 46 105 60 Q 103 80 100 95 Z" 
          fill="url(#grad1)"/>
    
    <!-- Middle finger -->
    <path d="M 100 95 Q 100 65 102 40 Q 104 25 112 23 Q 120 22 122 30 Q 124 38 122 55 Q 120 75 117 95 Z" 
          fill="url(#grad1)"/>
    
    <!-- Ring finger -->
    <path d="M 117 95 Q 119 70 122 50 Q 124 35 130 32 Q 136 30 139 38 Q 142 46 140 60 Q 137 80 133 95 Z" 
          fill="url(#grad1)"/>
    
    <!-- Pinky -->
    <path d="M 130 100 Q 133 80 138 65 Q 142 55 147 58 Q 152 61 151 70 Q 150 85 145 100 Z" 
          fill="url(#grad1)" opacity="0.9"/>
    
    <!-- Palm -->
    <path d="M 75 110 Q 85 105 100 105 Q 115 105 130 110 Q 135 125 135 140 Q 135 155 125 160 Q 110 165 100 165 Q 90 165 75 160 Q 65 155 65 140 Q 65 125 75 110 Z" 
          fill="url(#grad1)" opacity="0.5"/>
  </g>
  
  <!-- Circular border with neon effect -->
  <circle cx="100" cy="100" r="90" stroke="url(#grad1)" stroke-width="3" fill="none" opacity="0.6"/>
  <circle cx="100" cy="100" r="85" stroke="url(#grad1)" stroke-width="1" fill="none" opacity="0.3"/>
</svg>
