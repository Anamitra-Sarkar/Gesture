# Docker Compose for Hand Gesture Recognition Platform
version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG_MODE=false
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    devices:
      - /dev/video0:/dev/video0  # Camera access
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  uploads:
  logs:
